<style>
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #1E1E1E;
        color: #FFFFFF;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .chat-container {
        width: 100%;
        max-width: 420px;
        height: 95vh;
        background-color: #2A2A2A;
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        display: flex;
        flex-direction: column;
        overflow: hidden;
    }

    /* ===============================
       🖼️ ÁREA DO LOGO
       =============================== */
    .logo-area {
        background: linear-gradient(135deg, #7B3FE4, #2D9CDB);
        padding: 14px;
        text-align: center;
    }

    .logo-area img {
        max-height: 110px;
        max-width: 100%;
    }

    /* ===============================
       💬 MENSAGENS
       =============================== */
    .messages {
        flex: 1;
        padding: 12px;
        overflow-y: auto;
    }

    .message {
        padding: 10px 12px;
        border-radius: 12px;
        margin-bottom: 8px;
        max-width: 85%;
        word-wrap: break-word;
        font-size: 15px;
    }

    .bot {
        background-color: #333333;
        color: #FFFFFF;
    }

    .user {
        background: linear-gradient(135deg, #7B3FE4, #2D9CDB);
        color: #FFFFFF;
        align-self: flex-end;
    }

    .typing {
        font-style: italic;
        opacity: 0.8;
    }

    /* ===============================
       ❓ PERGUNTAS FREQUENTES
       =============================== */
    .faq {
        padding: 10px;
        background-color: #242424;
    }

    .faq button {
        width: 100%;
        background-color: #333333;
        color: #FFFFFF;
        border: none;
        border-radius: 8px;
        padding: 8px;
        margin-bottom: 6px;
        cursor: pointer;
        transition: 0.2s;
    }

    .faq button:hover {
        background: linear-gradient(135deg, #7B3FE4, #2D9CDB);
    }

    /* ===============================
       ⌨️ INPUT
       =============================== */
    .input-area {
        display: flex;
        padding: 10px;
        background-color: #1A1A1A;
    }

    .input-area input {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        outline: none;
        background-color: #2A2A2A;
        color: #FFFFFF;
    }

    .input-area input::placeholder {
        color: #AAAAAA;
    }

    .input-area button {
        margin-left: 8px;
        background: linear-gradient(135deg, #7B3FE4, #2D9CDB);
        border: none;
        border-radius: 8px;
        padding: 0 16px;
        font-weight: bold;
        color: #FFFFFF;
        cursor: pointer;
        transition: 0.2s;
    }

    .input-area button:hover {
        opacity: 0.9;
    }

    /* ===============================
       📱 MOBILE
       =============================== */
    @media (max-width: 480px) {
        .chat-container {
            height: 100vh;
            border-radius: 0;
        }
    }
</style>

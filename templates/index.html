<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistente - Fogão Mineiro</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #3b1f14, #6b3b23);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

/* CONTAINER */
.chat-container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    background-color: #5a2f1a;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* LOGO */
.logo-area {
    background: #e6d3b3;
    text-align: center;
    padding: 10px;
}

.logo-area img {
    max-height: 80px;
}

/* MENSAGENS */
.messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
}

.message {
    padding: 10px;
    border-radius: 12px;
    margin-bottom: 8px;
    max-width: 85%;
    font-size: 14px; /* 👈 fonte reduzida */
}

.bot {
    background-color: #7a4a2e;
    color: #fff;
}

.user {
    background-color: #c89b5a;
    color: #000;
    margin-left: auto;
}

/* LINK BOTÃO */
.link-btn {
    display: inline-block;
    background-color: #c89b5a;
    color: #000;
    padding: 10px 14px;
    border-radius: 10px;
    text-decoration: none;
    font-weight: bold;
    margin-top: 8px;
    font-size: 14px;
}

/* FAQ */
.faq {
    padding: 10px;
}

.faq button {
    width: 100%;
    padding: 10px;
    margin-bottom: 6px;
    border: none;
    border-radius: 10px;
    background: #7a4a2e;
    color: #fff;
    font-size: 14px;
}

/* INPUT */
.input-area {
    display: flex;
    padding: 10px;
    background: #3b1f14;
}

.input-area input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

.input-area button {
    margin-left: 8px;
    padding: 10px 14px;
    border: none;
    border-radius: 10px;
    background: #c89b5a;
    font-weight: bold;
}

/* MOBILE */
@media (max-width: 480px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">

    <!-- LOGO -->
    <div class="logo-area">
        <img src="/static/logo.png">
    </div>

    <!-- MENSAGENS -->
    <div class="messages" id="messages"></div>

    <!-- FAQ -->
    <div class="faq" id="faq"></div>

    <!-- INPUT -->
    <div class="input-area">
        <input id="input" placeholder="Digite sua dúvida..." />
        <button onclick="enviar()">Enviar</button>
    </div>

</div>

<script>

/* ============================
   CONFIGURAÇÃO EDITÁVEL
============================ */
const mensagemInicial =
"Olá, sou o Mineirinho assistente virtual do Restaurante Fogão Mineiro 😊<br>É só digitar a sua dúvida.";

const perguntas = [
"Formas de pagamento!",
"Dia e horário de funcionamento!",
"Cardápio online!",
"Reservas"
];

/* ============================
   ELEMENTOS
============================ */
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const faq = document.getElementById("faq");

/* ============================
   BOAS-VINDAS
============================ */
addMsg(mensagemInicial, "bot");

perguntas.forEach(p => {
    const btn = document.createElement("button");
    btn.innerText = p;
    btn.onclick = () => enviarFAQ(p);
    faq.appendChild(btn);
});

/* ============================
   ENTER ENVIA (MOBILE INCLUSO)
============================ */
input.addEventListener("keydown", e => {
    if (e.key === "Enter") enviar();
});

/* ============================
   ENVIO
============================ */
function enviar() {
    const texto = input.value.trim();
    if (!texto) return;

    addMsg(texto, "user");
    input.value = "";
    digitando();

    fetch(`/perguntar?pergunta=${encodeURIComponent(texto)}`)
        .then(r => r.json())
        .then(data => {
            pararDigitando();
            renderResposta(data.resposta);
        })
        .catch(() => {
            pararDigitando();
            addMsg("Erro ao conectar com servidor.", "bot");
        });
}

function enviarFAQ(p) {
    addMsg(p, "user");
    digitando();

    fetch(`/perguntar?pergunta=${encodeURIComponent(p)}`)
        .then(r => r.json())
        .then(data => {
            pararDigitando();
            renderResposta(data.resposta);
        });
}

/* ============================
   RENDER RESPOSTA (LINK FIX MOBILE)
============================ */
function renderResposta(texto) {

    // Detecta link markdown
    const regex = /\[([^\]]+)\]\((https?:\/\/[^\s]+)\)/g;

    if (regex.test(texto)) {
        const novo = texto.replace(regex, (_, txt, url) => {
            return `<a href="${url}" target="_blank" class="link-btn">${txt}</a>`;
        });
        addMsg(novo, "bot");
    } else {
        addMsg(texto, "bot");
    }
}

/* ============================
   UTIL
============================ */
function addMsg(texto, tipo) {
    const div = document.createElement("div");
    div.className = `message ${tipo}`;
    div.innerHTML = texto;
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
}

function digitando() {
    const d = document.createElement("div");
    d.id = "digitando";
    d.className = "message bot";
    d.innerText = "Digitando...";
    messages.appendChild(d);
}

function pararDigitando() {
    const d = document.getElementById("digitando");
    if (d) d.remove();
}

</script>

</body>
</html>

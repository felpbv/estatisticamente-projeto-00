<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Assistente Virtual - Sabores da Terra</title>

    <!-- 📱 MOBILE -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 🎨 ESTILO -->
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(180deg, #5C3A21, #7A4A2E);
            color: #F5E6C8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 95vh;
            background-color: #3E2615;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* 🖼️ LOGO */
        .logo-area {
            background: #F5E6C8;
            padding: 12px;
            text-align: center;
        }

        .logo-area img {
            max-height: 90px;
        }

        /* 💬 MENSAGENS */
        .messages {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        .message {
            padding: 10px 12px;
            border-radius: 12px;
            margin-bottom: 8px;
            max-width: 85%;
            word-wrap: break-word;
            line-height: 1.4;
        }

        .bot {
            background: #6D4B2F;
        }

        .user {
            background: #C79A63;
            color: #3E2615;
            align-self: flex-end;
        }

        /* 🔥 BOTÃO DE LINK (CORREÇÃO PRINCIPAL) */
        .link-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 10px 14px;
            background-color: #C79A63;
            color: #3E2615;
            border-radius: 8px;
            font-weight: bold;
            text-decoration: none;
            font-size: 14px;

            /* MOBILE FIX */
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }

        .link-btn:active {
            transform: scale(0.97);
        }

        /* ❓ FAQ */
        .faq {
            padding: 10px;
            background: #4A2C19;
        }

        .faq button {
            width: 100%;
            background: #6D4B2F;
            color: #F5E6C8;
            border: none;
            border-radius: 8px;
            padding: 8px;
            margin-bottom: 6px;
            cursor: pointer;
        }

        /* ⌨️ INPUT */
        .input-area {
            display: flex;
            padding: 10px;
            background: #2A180D;
        }

        .input-area input {
            flex: 1;
            padding: 10px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
            outline: none;
        }

        .input-area button {
            margin-left: 8px;
            background: #C79A63;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* 📱 MOBILE */
        @media (max-width: 480px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">

    <!-- LOGO -->
    <div class="logo-area">
        <img src="/static/logo.png" alt="Logo">
    </div>

    <!-- MENSAGENS -->
    <div class="messages" id="messages"></div>

    <!-- FAQ -->
    <div class="faq" id="faq"></div>

    <!-- INPUT -->
    <div class="input-area">
        <input type="text" id="input" placeholder="Digite sua dúvida..." />
        <button onclick="enviarMensagem()">Enviar</button>
    </div>

</div>

<script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");
    const faqDiv = document.getElementById("faq");

    // 👋 BOAS-VINDAS
    adicionarMensagem(
        "Olá! Sou a assistente virtual do restaurante 😊<br>Digite sua dúvida abaixo.",
        "bot"
    );

    // ❓ FAQ
    const perguntas = [
       
        
        "Cardápio online!",
        "Reservas",
        "Dia e horário de funcionamento!",
        "Valor Buffet",
    ];

    perguntas.forEach(p => {
        const btn = document.createElement("button");
        btn.innerText = p;
        btn.onclick = () => enviarPerguntaFAQ(p);
        faqDiv.appendChild(btn);
    });

    // ⌨️ ENTER ENVIA
    input.addEventListener("keypress", function(e) {
        if (e.key === "Enter") {
            enviarMensagem();
        }
    });

    // 📤 ENVIAR
    function enviarMensagem() {
        const texto = input.value.trim();
        if (!texto) return;

        adicionarMensagem(texto, "user");
        input.value = "";

        mostrarDigitando();

        fetch(`/perguntar?pergunta=${encodeURIComponent(texto)}`)
            .then(res => res.json())
            .then(data => {
                removerDigitando();
                adicionarMensagem(data.resposta, "bot");
            })
            .catch(() => {
                removerDigitando();
                adicionarMensagem("Erro ao conectar.", "bot");
            });
    }

    function enviarPerguntaFAQ(pergunta) {
        adicionarMensagem(pergunta, "user");
        mostrarDigitando();

        fetch(`/perguntar?pergunta=${encodeURIComponent(pergunta)}`)
            .then(res => res.json())
            .then(data => {
                removerDigitando();
                adicionarMensagem(data.resposta, "bot");
            });
    }

    // 💬 ADICIONAR MENSAGEM (🔥 CORREÇÃO PRINCIPAL)
    function adicionarMensagem(texto, tipo) {
        const div = document.createElement("div");
        div.className = `message ${tipo}`;

        // 🔥 ESSENCIAL: renderiza HTML (links + <br>)
        div.innerHTML = texto;

        messages.appendChild(div);

        setTimeout(() => {
            messages.scrollTop = messages.scrollHeight;
        }, 50);
    }

    // ⏳ LOADING
    function mostrarDigitando() {
        const div = document.createElement("div");
        div.className = "message bot";
        div.id = "digitando";
        div.innerHTML = "Digitando...";
        messages.appendChild(div);
    }

    function removerDigitando() {
        const el = document.getElementById("digitando");
        if (el) el.remove();
    }
</script>

</body>
</html>

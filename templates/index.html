<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Assistente - Fogão Mineiro</title>

<style>
body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(180deg, #3b1f14, #6b3b23);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-container {
    width: 100%;
    max-width: 420px;
    height: 95vh;
    background-color: #5a2f1a;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.logo-area {
    background: #e6d3b3;
    text-align: center;
    padding: 10px;
}

.logo-area img {
    max-height: 80px;
}

.messages {
    flex: 1;
    padding: 12px;
    overflow-y: auto;
}

.message {
    display: flex;
    margin-bottom: 10px;
}

.bubble {
    padding: 10px 12px;
    border-radius: 14px;
    max-width: 75%;
    font-size: 14px;
    line-height: 1.5;
}

.bot .bubble {
    background-color: #7a4a2e;
    color: #fff;
}

.user {
    justify-content: flex-end;
}

.user .bubble {
    background-color: #c89b5a;
    color: #000;
}

/* BOTÃO LINK */
.link-btn {
    display: inline-block;
    margin-top: 6px;
    padding: 10px 14px;
    background: #C79A63;
    color: #3E2615;
    border-radius: 12px;
    text-decoration: none;
    font-weight: bold;
}

.faq {
    padding: 10px;
}

.faq button {
    width: 100%;
    padding: 10px;
    margin-bottom: 6px;
    border: none;
    border-radius: 10px;
    background: #7a4a2e;
    color: #fff;
}

.input-area {
    display: flex;
    padding: 10px;
    background: #3b1f14;
}

.input-area input {
    flex: 1;
    padding: 10px;
    border-radius: 10px;
    border: none;
    font-size: 14px;
}

.input-area button {
    margin-left: 8px;
    padding: 10px;
    border: none;
    border-radius: 10px;
    background: #c89b5a;
    font-weight: bold;
}

/* typing */
.typing {
    display: flex;
    gap: 4px;
}

.dot {
    width: 6px;
    height: 6px;
    background: #fff;
    border-radius: 50%;
    animation: blink 1.2s infinite;
}

.dot:nth-child(2){animation-delay:0.2s;}
.dot:nth-child(3){animation-delay:0.4s;}

@keyframes blink {
    0%,80%,100%{opacity:0;}
    40%{opacity:1;}
}

@media (max-width: 480px) {
    .chat-container {
        height: 100vh;
        border-radius: 0;
    }
}
</style>
</head>

<body>

<div class="chat-container">

<div class="logo-area">
    <img src="/static/logo.png">
</div>

<div class="messages" id="messages"></div>

<div class="faq" id="faq"></div>

<div class="input-area">
    <input id="input" placeholder="Digite sua dúvida..." />
    <button onclick="enviar()">Enviar</button>
</div>

</div>

<script>

/* CONFIG */
const mensagemInicial =
"Olá, sou o Mineirinho 🤠 assistente virtual.<br>Digite sua dúvida!";

const perguntas = [
"Formas de pagamento!",
"Horário de funcionamento!",
"Cardápio online!",
"Reservas"
];

const messages = document.getElementById("messages");
const input = document.getElementById("input");
const faq = document.getElementById("faq");

/* BOAS VINDAS */
addMsg(mensagemInicial, "bot");

/* FAQ */
perguntas.forEach(p => {
    const btn = document.createElement("button");
    btn.innerText = p;
    btn.onclick = () => enviarFAQ(p);
    faq.appendChild(btn);
});

/* ENTER */
input.addEventListener("keydown", e => {
    if (e.key === "Enter") enviar();
});

/* ENVIO */
function enviar() {
    const texto = input.value.trim();
    if (!texto) return;

    addMsg(texto, "user");
    input.value = "";
    typing();

    fetch(`/perguntar?pergunta=${encodeURIComponent(texto)}`)
        .then(r => r.json())
        .then(data => {
            stopTyping();
            renderResposta(data.resposta);
        });
}

function enviarFAQ(p) {
    addMsg(p, "user");
    typing();

    fetch(`/perguntar?pergunta=${encodeURIComponent(p)}`)
        .then(r => r.json())
        .then(data => {
            stopTyping();
            renderResposta(data.resposta);
        });
}

/* 🔥 FUNÇÃO CORRETA */
function renderResposta(texto) {

    // remove QUALQUER HTML
    texto = texto.replace(/<[^>]*>?/gm, "");

    // pega link
    const urlRegex = /(https?:\/\/[^\s]+)/g;

    if (urlRegex.test(texto)) {
        const url = texto.match(urlRegex)[0];

        texto = texto.replace(url, "") +
        `<br><a href="${url}" target="_blank" class="link-btn">Abrir link</a>`;
    }

    addMsg(texto, "bot");
}

/* MSG */
function addMsg(texto, tipo) {
    const msg = document.createElement("div");
    msg.className = `message ${tipo}`;

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = texto;

    msg.appendChild(bubble);
    messages.appendChild(msg);

    messages.scrollTop = messages.scrollHeight;
}

/* typing */
function typing() {
    const msg = document.createElement("div");
    msg.id = "typing";
    msg.className = "message bot";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.innerHTML = `
        <div class="typing">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    `;

    msg.appendChild(bubble);
    messages.appendChild(msg);
}

function stopTyping() {
    const t = document.getElementById("typing");
    if (t) t.remove();
}

</script>

</body>
</html>
